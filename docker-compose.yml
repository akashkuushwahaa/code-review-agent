# Full stack: the on-demand review agent, the dashboard API, and the web UI.
#
#   docker compose up                 # brings up the dashboard (API + web) at
#                                     #   http://localhost:3000
#   docker compose run --rm agent https://github.com/owner/repo/pull/123
#                                     # reviews a PR on demand
#
# The agent is a CLI, not a service, so it's behind a profile and does not
# start with `up` — but `run` still works. API and web share the `findings`
# volume the agent writes to, so the dashboard reflects real reviews.

services:
  agent:
    build: .
    image: code-review-agent
    profiles: ["agent"] # on-demand only; `docker compose run --rm agent ...`
    env_file:
      - .env
    environment:
      REVIEW_DB_PATH: /data/findings.db
    volumes:
      - findings:/data

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    image: code-review-agent-api
    environment:
      # The API needs no secrets — just the shared DB path and eval snapshot.
      REVIEW_DB_PATH: /data/findings.db
    volumes:
      - findings:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    image: code-review-agent-web
    environment:
      # Server-side fetches go to the API over the compose network.
      API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  findings:
